<div class="skills-section">
    <h2 class="mb-4">Skills</h2>
    <div class="row">
      <div class="col-md-3 col-sm-4 mb-3" *ngFor="let skill of skills">
        <div class="card h-100 text-center">
          <img [src]="skill.img" class="card-img-top mx-auto mt-3" style="width: 50px;" [alt]="skill.name">
          <div class="card-body">
            <h5 class="card-title">{{ skill.name }}</h5>
          </div>
        </div>
      </div>
    </div>
  </div>
