<div class="contact-section">
  <h2>Contattami</h2>
  <form id="contact-form" action="https://formsubmit.co/pasquale.laterza94@gmail.com" method="POST">
    
    <div class="form-group">
      <input type="text" name="name" class="form-control" placeholder="Nome">
    </div>
    
    <div class="form-group">
      <input type="email" name="email" class="form-control" placeholder="Email *" required>
    </div>
    
    <div class="form-group">
      <textarea name="message" class="form-control" placeholder="Messaggio *" rows="5" required></textarea>
    </div>
    
    <input type="hidden" name="_subject" value="Nuovo messaggio dal sito web">
    <input type="hidden" name="_next" value="https://www.pasqualelaterza.com/message-sent">
    
    <button type="submit" class="btn btn-primary">Invia!</button>
  </form>
</div>
